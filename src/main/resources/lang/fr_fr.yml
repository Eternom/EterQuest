# Textes d'EterQuest (MiniMessage). Palette : <primary> <accent> <info> <error> <success> (EterLib/config.yml).

error:
  generic: "<error>Une erreur est survenue, réessaie dans un instant."
  players-only: "<error>Commande réservée aux joueurs."

quest:
  default-name: "<white>Quête"
  started: "<success>Nouvelle quête : <quest><success> ! <info>Ton journal : <accent>/quests"
  already-active: "<info>Tu es déjà sur la quête <quest><info>."
  already-done: "<info>Tu as déjà fait la quête <quest><info>."
  locked: "<error>Tu ne peux pas encore commencer <quest><error>."
  objective-done: "<success>✔ <objective>"
  ready: "<success>Quête prête : <quest><success>. Il ne reste qu'à la rendre."
  ready-remote: "<success>Quête prête : <quest><success>. Rends-la depuis ton journal (<accent>/quests</accent>, clic droit)."
  ready-npc: "<success>Quête prête : <quest><success>. Retourne voir <accent><npc></accent>."
  ready-reminder: "<info>Tu as <accent><count></accent> quête(s) prête(s) à rendre."
  stage-next: "<accent>» <quest> <dark_gray>: <info><text>"
  stage-next-default: "étape suivante, regarde ton journal."
  time-limit: "<gold>⏳ Tu as <accent><time></accent> pour cette étape !"
  time-up: "<error>⏳ Temps écoulé pour <quest><error> : l'étape recommence."
  done: "<gold>✔ Quête terminée : <quest><gold> !"
  npc-waiting: "<info>Pas encore prêt pour <quest><info> : regarde ton journal (<accent>/quests</accent>)."
  npc-line: "<accent><npc></accent> <dark_gray>»</dark_gray> <white><text>"
  quiet-on: "<info>Messages de progression des quêtes coupés."
  quiet-off: "<info>Messages de progression des quêtes remis."
  cannot-abandon: "<error>Cette quête ne peut pas être abandonnée."
  abandoned: "<info>Quête abandonnée : <quest><info>."

reputation:
  gained: "<success>+<points> réputation"
  lost: "<error>-<points> réputation"

turn-in:
  not-here: "<error>Cette étape ne se rend pas ici."
  remote-items: "<error>Il y a des objets à remettre : rends-la au PNJ."
  not-ready: "<error>Les objectifs ne sont pas encore remplis."
  missing-items: "<error>Il te manque des objets (simples, sans nom ni enchantement)."
  expired: "<error>Cette quête n'est plus valable."
  already: "<info>Cette quête a déjà été rendue ou a changé."
  busy: "<info>Un instant..."
  error: "<error>Erreur : tes objets t'ont été rendus."

objective:
  progress: "<accent><have></accent><dark_gray>/</dark_gray><accent><amount>"
  progress-done: "<success>✔ <amount>"
  optional: " <dark_gray>(bonus)"
  custom: "<info><text> <progress><where>"
  deliver: "<info>Remettre : <item> <progress><where>"
  break: "<info>Casser : <item> <progress><where>"
  break-any: "<info>Casser des blocs <progress><where>"
  harvest: "<info>Récolter : <item> <progress><where>"
  harvest-any: "<info>Récolter des cultures <progress><where>"
  kill: "<info>Tuer : <item> <progress><where>"
  kill-any: "<info>Tuer des monstres <progress><where>"
  fish: "<info>Pêcher : <item> <progress><where>"
  fish-any: "<info>Pêcher <progress><where>"
  craft: "<info>Fabriquer : <item> <progress><where>"
  craft-any: "<info>Fabriquer des objets <progress><where>"
  smelt: "<info>Faire fondre : <item> <progress><where>"
  smelt-any: "<info>Faire fondre <progress><where>"
  breed: "<info>Élever : <item> <progress><where>"
  breed-any: "<info>Faire naître des animaux <progress><where>"
  explore: "<info>Explorer : <item> <progress><where>"
  explore-any: "<info>Explorer <progress><where>"
  enchant: "<info>Enchanter : <item> <progress><where>"
  enchant-any: "<info>Enchanter des objets <progress><where>"
  trade: "<info>Acheter aux villageois : <item> <progress><where>"
  trade-any: "<info>Commercer avec les villageois <progress><where>"
  talk: "<info>Parler à <accent><item></accent> <progress><where>"
  signal: "<info><item> <progress><where>"

# Noms des groupes d'objectifs (#ores...)
group:
  ores: "minerais"
  logs: "bûches"
  crops: "cultures"
  fish: "poissons"
  stone: "pierres"
  flowers: "fleurs"

# Où et quand un objectif compte : « (la nuit, sous Y 0) »
where:
  format: " <dark_gray>(<conditions>)"
  time:
    day: "le jour"
    night: "la nuit"
  weather:
    clear: "par beau temps"
    rain: "sous la pluie"
    thunder: "sous l'orage"
  dimension:
    normal: "dans le monde normal"
    nether: "dans le Nether"
    the_end: "dans l'End"
  max-y: "sous Y <y>"
  min-y: "au-dessus de Y <y>"
  biomes: "biome : <biomes>"
  servers: "sur <servers>"

lore:
  objective: "<dark_gray>▸ "
  stage: "<dark_gray>Étape <accent><stage></accent>/<stages>"
  time-limit: "<gold>⏳ <time> pour cette étape"
  turn-in-npc: "<dark_gray>À rendre à <accent><npc>"

sidebar:
  title: "<gradient:#B57EDC:#7E57C2><bold>Quêtes"
  summary-ready: "<success>✔ <quest>"
  summary-todo: "<gray>• <quest>"
  time-left: "<gold>⏳ <time>"
  ready: "<success>Prête à rendre !"
  todo: "<gray>/quests : ton journal"

marker:
  talk: "<yellow><bold>?"
  ready: "<gold><bold>!"

track:
  on: "<info>Quête suivie dans la sidebar."
  off: "<info>Plus de quête suivie."
  summary-on: "<info>Toutes tes quêtes en cours dans la sidebar."

box:
  added: "<info>Ce qui ne tenait pas dans ton inventaire est dans ta boîte de récupération (<accent>/quests box</accent>)."
  empty: "<info>Ta boîte de récupération est vide."
  full: "<error>Fais de la place : le colis suivant ne tient pas dans ton inventaire."
  taken: "<success>Colis récupéré."

category:
  job: "Métier"
  village: "Village"
  event: "Évènement"
  quest: "Quête"

journal:
  title: "<dark_gray>Journal des quêtes"
  player: "<accent><player>"
  reputation: "<dark_gray>▸ <info>Réputation : <accent><points>"
  count: "<dark_gray>▸ <info>En cours : <accent><live></accent> <dark_gray>· <info>prêtes : <accent><ready>"
  completed: "<dark_gray>▸ <info>Quêtes différentes faites : <accent><count>"
  quest-name: "<quest> <dark_gray>· <gray><category>"
  empty: "<info>Aucune quête en cours"
  empty-lore: "<gray>La guilde des métiers et les villageois en donnent."
  previous: "<info>Page précédente"
  next: "<info>Page suivante"
  box: "<accent>Boîte de récupération"
  box-lore: "<gray>Colis : <accent><count></accent> <dark_gray>· clic pour les prendre"
  summary: "<accent>Sidebar : toutes mes quêtes"
  summary-on: "<success>affichées</success> <dark_gray>· clic pour arrêter"
  summary-off: "<gray>cachées <dark_gray>· clic pour les afficher"
  quiet: "<accent>Messages de progression"
  quiet-on: "<error>coupés</error> <dark_gray>· clic pour les remettre"
  quiet-off: "<success>affichés</success> <dark_gray>· clic pour les couper"
  done: "<success>✔ Terminée"
  expired: "<gray>Plus valable"
  expires: "<gray>Valable encore <accent><time>"
  ready: "<success>Prête : va la rendre !"
  ready-remote: "<success>Prête : clic droit pour la rendre"
  track: "<dark_gray>Clic : la suivre dans la sidebar"
  untrack: "<dark_gray>Clic : ne plus la suivre"
  abandon: "<dark_gray>Maj + clic droit : l'abandonner"

admin:
  usage: "<info>/eterquest <accent>list [propriétaire] · info <quête> · player <joueur> · give <joueur> <quête> · stage <joueur> <owner/slot> <étape> · complete <joueur> <owner/slot> · remove <joueur> <owner/slot> · reputation <joueur> [set|add <points>] · debug <joueur> · stats [jours] · reload"
  reloaded: "<success>EterQuest rechargé sur tout le réseau."
  list-header: "<info>Quêtes du réseau : <accent><count>"
  list-line: "<dark_gray> · <accent><id></accent> <gray><owner> / <category> · <stages> étape(s) · v<version>"
  unknown-quest: "<error>Quête inconnue."
  info-header: "<accent><id></accent> <gray>(<owner>, <category>, v<version>) <dark_gray><tags>"
  info-requires: "<info>Conditions : <gray><requires>"
  info-stage: "<info>Étape <accent><index></accent> <gray><id></gray> <dark_gray>[<turnin>]</dark_gray> <gray><objectives>"
  info-meta: "<info>Meta : <gray><meta>"
  player-offline: "<error>Joueur absent de ce serveur."
  player-header: "<info>Quêtes de <accent><player></accent> : <accent><count>"
  player-line: "<dark_gray> · <accent><key></accent> <gray><quest> · étape <stage> · <state> · <progress>"
  given: "<success>Quête <accent><quest></accent> donnée à <accent><player></accent>."
  unknown-instance: "<error>Quête du joueur inconnue (owner/slot : voir /eterquest player)."
  unknown-stage: "<error>Étape inconnue."
  stage-set: "<success>Étape <accent><stage></accent> en cours."
  failed: "<error>Impossible : la quête a changé entre-temps."
  completed: "<success>Quête terminée."
  removed: "<success>Quête retirée."
  reputation: "<info>Réputation de <accent><player></accent> : <accent><points>"
  not-a-number: "<error>Nombre invalide."
  debug-on: "<success>Tu suis les signaux de <accent><player></accent>."
  debug-off: "<info>Tu ne suis plus <accent><player></accent>."
  debug-line: "<dark_gray>[quêtes] <gray><player> : <text>"
  stats-header: "<info>Quêtes finies (<accent><days></accent> jours) :"
  stats-line: "<dark_gray> · <info><day> <gray><detail>"
  rate-alert: "<error>[Quêtes] <accent><player></accent> a cassé <accent><count></accent> blocs en une minute."
