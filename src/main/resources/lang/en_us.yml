# EterQuest texts (MiniMessage). Palette: <primary> <accent> <info> <error> <success> (EterLib/config.yml).

error:
  generic: "<error>Something went wrong, try again in a moment."
  players-only: "<error>Players only."

quest:
  default-name: "<white>Quest"
  started: "<success>New quest: <quest><success>! <info>Your journal: <accent>/quests"
  already-active: "<info>You are already on the quest <quest><info>."
  already-done: "<info>You already did the quest <quest><info>."
  locked: "<error>You cannot start <quest><error> yet."
  objective-done: "<success>✔ <objective>"
  ready: "<success>Quest ready: <quest><success>. You just have to hand it in."
  ready-remote: "<success>Quest ready: <quest><success>. Hand it in from your journal (<accent>/quests</accent>, right click)."
  ready-npc: "<success>Quest ready: <quest><success>. Go back to <accent><npc></accent>."
  ready-reminder: "<info>You have <accent><count></accent> quest(s) ready to hand in."
  stage-next: "<accent>» <quest> <dark_gray>: <info><text>"
  stage-next-default: "next step, check your journal."
  time-limit: "<gold>⏳ You have <accent><time></accent> for this step!"
  time-up: "<error>⏳ Time is up for <quest><error>: the step starts over."
  done: "<gold>✔ Quest complete: <quest><gold>!"
  npc-waiting: "<info>Not ready yet for <quest><info>: check your journal (<accent>/quests</accent>)."
  npc-line: "<accent><npc></accent> <dark_gray>»</dark_gray> <white><text>"
  quiet-on: "<info>Quest progress messages muted."
  quiet-off: "<info>Quest progress messages back on."
  cannot-abandon: "<error>This quest cannot be abandoned."
  abandoned: "<info>Quest abandoned: <quest><info>."

reputation:
  gained: "<success>+<points> reputation"
  lost: "<error>-<points> reputation"

turn-in:
  not-here: "<error>This step is not handed in here."
  remote-items: "<error>There are items to hand over: bring it to the NPC."
  not-ready: "<error>The objectives are not done yet."
  missing-items: "<error>You are missing items (plain ones, no name nor enchantment)."
  expired: "<error>This quest is no longer valid."
  already: "<info>This quest was already handed in or has changed."
  busy: "<info>One moment..."
  error: "<error>Error: your items were given back."

objective:
  progress: "<accent><have></accent><dark_gray>/</dark_gray><accent><amount>"
  progress-done: "<success>✔ <amount>"
  optional: " <dark_gray>(bonus)"
  custom: "<info><text> <progress><where>"
  deliver: "<info>Hand over: <item> <progress><where>"
  break: "<info>Break: <item> <progress><where>"
  break-any: "<info>Break blocks <progress><where>"
  harvest: "<info>Harvest: <item> <progress><where>"
  harvest-any: "<info>Harvest crops <progress><where>"
  kill: "<info>Kill: <item> <progress><where>"
  kill-any: "<info>Kill monsters <progress><where>"
  fish: "<info>Fish: <item> <progress><where>"
  fish-any: "<info>Fish <progress><where>"
  craft: "<info>Craft: <item> <progress><where>"
  craft-any: "<info>Craft items <progress><where>"
  smelt: "<info>Smelt: <item> <progress><where>"
  smelt-any: "<info>Smelt <progress><where>"
  breed: "<info>Breed: <item> <progress><where>"
  breed-any: "<info>Breed animals <progress><where>"
  explore: "<info>Explore: <item> <progress><where>"
  explore-any: "<info>Explore <progress><where>"
  enchant: "<info>Enchant: <item> <progress><where>"
  enchant-any: "<info>Enchant items <progress><where>"
  trade: "<info>Buy from villagers: <item> <progress><where>"
  trade-any: "<info>Trade with villagers <progress><where>"
  talk: "<info>Talk to <accent><item></accent> <progress><where>"
  signal: "<info><item> <progress><where>"

group:
  ores: "ores"
  logs: "logs"
  crops: "crops"
  fish: "fish"
  stone: "stone"
  flowers: "flowers"

where:
  format: " <dark_gray>(<conditions>)"
  time:
    day: "by day"
    night: "at night"
  weather:
    clear: "in clear weather"
    rain: "in the rain"
    thunder: "during a thunderstorm"
  dimension:
    normal: "in the overworld"
    nether: "in the Nether"
    the_end: "in the End"
  max-y: "below Y <y>"
  min-y: "above Y <y>"
  biomes: "biome: <biomes>"
  servers: "on <servers>"

lore:
  objective: "<dark_gray>▸ "
  stage: "<dark_gray>Step <accent><stage></accent>/<stages>"
  time-limit: "<gold>⏳ <time> for this step"
  turn-in-npc: "<dark_gray>Hand in to <accent><npc>"

sidebar:
  title: "<gradient:#B57EDC:#7E57C2><bold>Quests"
  summary-ready: "<success>✔ <quest>"
  summary-todo: "<gray>• <quest>"
  time-left: "<gold>⏳ <time>"
  ready: "<success>Ready to hand in!"
  todo: "<gray>/quests: your journal"

marker:
  talk: "<yellow><bold>?"
  ready: "<gold><bold>!"

track:
  on: "<info>Quest tracked in the sidebar."
  off: "<info>No tracked quest anymore."
  summary-on: "<info>All your current quests in the sidebar."

box:
  added: "<info>What did not fit in your inventory is in your recovery box (<accent>/quests box</accent>)."
  empty: "<info>Your recovery box is empty."
  full: "<error>Make some room: the next parcel does not fit in your inventory."
  taken: "<success>Parcel collected."

category:
  job: "Job"
  village: "Village"
  event: "Event"
  quest: "Quest"

journal:
  title: "<dark_gray>Quest journal"
  player: "<accent><player>"
  reputation: "<dark_gray>▸ <info>Reputation: <accent><points>"
  count: "<dark_gray>▸ <info>Current: <accent><live></accent> <dark_gray>· <info>ready: <accent><ready>"
  completed: "<dark_gray>▸ <info>Different quests done: <accent><count>"
  quest-name: "<quest> <dark_gray>· <gray><category>"
  empty: "<info>No current quest"
  empty-lore: "<gray>The job guild and the villagers give some."
  previous: "<accent>« Previous page"
  next: "<accent>Next page »"
  box: "<accent>Recovery box"
  box-lore: "<gray>Parcels: <accent><count></accent> <dark_gray>· click to take them"
  summary: "<accent>Sidebar: all my quests"
  summary-on: "<success>shown</success> <dark_gray>· click to stop"
  summary-off: "<gray>hidden <dark_gray>· click to show them"
  quiet: "<accent>Progress messages"
  quiet-on: "<error>muted</error> <dark_gray>· click to turn them back on"
  quiet-off: "<success>shown</success> <dark_gray>· click to mute them"
  done: "<success>✔ Complete"
  expired: "<gray>No longer valid"
  expires: "<gray>Valid for <accent><time>"
  ready: "<success>Ready: go hand it in!"
  ready-remote: "<success>Ready: right click to hand it in"
  track: "<dark_gray>Click: track it in the sidebar"
  untrack: "<dark_gray>Click: stop tracking it"
  abandon: "<dark_gray>Shift + right click: abandon it"
  abandon-confirm:
    title: "<primary>Abandon the quest"
    body: "<info>Abandon <quest><info>? Its progress will be lost."
    button: "<error>Abandon"

admin:
  usage: "<info>/eterquest <accent>list [owner] · info <quest> · player <player> · give <player> <quest> · stage <player> <owner/slot> <step> · complete <player> <owner/slot> · remove <player> <owner/slot> · reputation <player> [set|add <points>] · debug <player> · stats [days] · reload"
  reloaded: "<success>EterQuest reloaded on the whole network."
  list-header: "<info>Network quests: <accent><count>"
  list-line: "<dark_gray> · <accent><id></accent> <gray><owner> / <category> · <stages> step(s) · v<version>"
  unknown-quest: "<error>Unknown quest."
  info-header: "<accent><id></accent> <gray>(<owner>, <category>, v<version>) <dark_gray><tags>"
  info-requires: "<info>Requirements: <gray><requires>"
  info-stage: "<info>Step <accent><index></accent> <gray><id></gray> <dark_gray>[<turnin>]</dark_gray> <gray><objectives>"
  info-meta: "<info>Meta: <gray><meta>"
  player-offline: "<error>Player not on this server."
  player-header: "<info>Quests of <accent><player></accent>: <accent><count>"
  player-line: "<dark_gray> · <accent><key></accent> <gray><quest> · step <stage> · <state> · <progress>"
  given: "<success>Quest <accent><quest></accent> given to <accent><player></accent>."
  unknown-instance: "<error>Unknown player quest (owner/slot: see /eterquest player)."
  unknown-stage: "<error>Unknown step."
  stage-set: "<success>Step <accent><stage></accent> in progress."
  failed: "<error>Impossible: the quest changed in the meantime."
  completed: "<success>Quest completed."
  removed: "<success>Quest removed."
  reputation: "<info>Reputation of <accent><player></accent>: <accent><points>"
  not-a-number: "<error>Invalid number."
  debug-on: "<success>You follow the signals of <accent><player></accent>."
  debug-off: "<info>You no longer follow <accent><player></accent>."
  debug-line: "<dark_gray>[quests] <gray><player>: <text>"
  stats-header: "<info>Completed quests (<accent><days></accent> days):"
  stats-line: "<dark_gray> · <info><day> <gray><detail>"
  rate-alert: "<error>[Quests] <accent><player></accent> broke <accent><count></accent> blocks in one minute."

menu:
  page-of: "<dark_gray>Page <page>/<pages>"
